<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }} | {{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;800&display=swap" rel="stylesheet">
    {% seo %}
</head>
<body class="dark-mode">
    <header class="navbar">
        <div class="container">
            <a href="{{ '/' | relative_url }}" class="logo">
                <img src="{{ '/assets/images/logo.png' | relative_url }}" alt="CyberPulse Logo">
            </a>
            <nav>
                <ul class="nav-links">
                    <li><a href="{{ '/' | relative_url }}">Home</a></li>
                    <li><a href="{{ '/about.md' | relative_url }}" class="btn-primary">About Me</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="content-wrapper container animate-fade-in">
        {{ content }}
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}. Built with passion for security.</p>
        </div>
    </footer>

    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
