<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }} | {{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;800&display=swap" rel="stylesheet">
    {% seo %}
</head>
<body class="dark-mode">
    <header class="navbar">
        <div class="container">
            <a href="{{ '/' | relative_url }}" class="logo">
                <img src="{{ '/assets/images/logo.png' | relative_url }}" alt="CyberPulse Logo">
            </a>
            <nav>
                <ul class="nav-links">
                    <li><a href="{{ '/' | relative_url }}">Home</a></li>
                    <li><a href="{{ '/about/' | relative_url }}" class="btn-primary">About Me</a></li>
                </ul>
                <div class="hacker-animation">
                    <svg viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg">
                        <!-- Monitor -->
                        <rect x="50" y="20" width="40" height="30" rx="2" fill="#1e293b" stroke="#00ff88" stroke-width="1"/>
                        <rect class="screen" x="53" y="23" width="34" height="24" fill="#0a0a0c"/>
                        <!-- Screen Text Lines -->
                        <rect class="line-1" x="55" y="26" width="20" height="2" fill="#00ff88" opacity="0.6"/>
                        <rect class="line-2" x="55" y="30" width="25" height="2" fill="#00ff88" opacity="0.6"/>
                        <rect class="line-3" x="55" y="34" width="15" height="2" fill="#00ff88" opacity="0.6"/>
                        <!-- Monitor Stand -->
                        <path d="M65 50 L75 50 L80 60 L60 60 Z" fill="#1e293b"/>
                        <!-- Hacker Silhouette -->
                        <circle class="hacker-head" cx="30" cy="40" r="8" fill="#0f172a"/>
                        <path class="hacker-body" d="M15 70 Q30 50 45 70 Z" fill="#0f172a"/>
                        <!-- Glow effect -->
                        <rect class="screen-glow" x="53" y="23" width="34" height="24" fill="#00ff88" opacity="0.1"/>
                    </svg>
                </div>
            </nav>
        </div>
    </header>

    <main class="content-wrapper container animate-fade-in">
        {{ content }}
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}. Built with passion for security.</p>
        </div>
    </footer>

    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
